
name: CI-CD React

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # INTEGRACAO CONTINUA
  ci:
    name: CI - Validacao do projeto
    runs-on: ubuntu-latest

    steps:
      # Checkout do repositorio
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Configuracao do Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Instalacao das dependencias
      - name: Instalar dependencias
        run: npm ci

      # Analise estatica do codigo
      - name: Executar Oxlint
        run: npm run lint

      # Verificacao de tipos e build
      - name: Gerar build
        run: npm run build

  # DEPLOYMENT CONTINUO
  cd:
    name: CD - Deploy na Vercel
    runs-on: ubuntu-latest

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # Checkout do repositorio
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Configuracao do Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Instalacao da Vercel CLI
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      # Recuperar configuracoes da Vercel
      - name: Configurar ambiente Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Gerar build de producao
      - name: Gerar build Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Publicar aplicacao
      - name: Realizar deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
